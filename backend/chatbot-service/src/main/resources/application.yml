spring:
  application: { name: CHATBOT-SERVICE }
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/freepdb1}
    username: ${DB_USERNAME:chatbot_app}
    password: ${DB_PASSWORD:chatbot_app@Password}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate: { ddl-auto: validate }
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER:http://localhost:8083}
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8083/.well-known/jwks.json}
          jws-algorithms: RS256
server: { port: 8085 }
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
chatbot:
  groq:
    # Supply GROQ_API_KEY via the environment or the deployment secret store; never commit it.
    api-key: ${GROQ_API_KEY:}
    base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    chat-model: ${GROQ_CHAT_MODEL:openai/gpt-oss-20b}
    timeout: ${GROQ_TIMEOUT:PT45S}
  rag:
    # Java loads this model in-process; no Python embedding service is required.
    embedding-model-path: ${EMBEDDING_MODEL_PATH:C:/oracle-vector-models/all_MiniLM_L12_v2.onnx}
    max-results: ${RAG_MAX_RESULTS:4}
    reindex-on-startup: ${RAG_REINDEX_ON_STARTUP:false}
