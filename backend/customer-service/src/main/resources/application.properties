spring.application.name=CUSTOMER-SERVICE
server.port=8001
spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:free
spring.datasource.username=system
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false

spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER:http://localhost:8083}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWKS_URI:http://localhost:8083/.well-known/jwks.json}
spring.security.oauth2.resourceserver.jwt.jws-algorithms=RS256
app.security.audience=prestige-banking-api
