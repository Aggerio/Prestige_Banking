spring.application.name=NOTIFICATION-SERVICE
server.port=8005
spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver
spring.datasource.url=${NOTIFICATION_DB_URL:jdbc:oracle:thin:@localhost:1521/freepdb1}
spring.datasource.username=${NOTIFICATION_DB_USERNAME:system}
spring.datasource.password=${NOTIFICATION_DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=validate
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER:http://localhost:8083}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWKS_URI:http://localhost:8083/.well-known/jwks.json}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${NOTIFICATION_CONSUMER_GROUP:notification-service}
spring.kafka.consumer.auto-offset-reset=earliest
app.notifications.topic=${NOTIFICATION_TOPIC:transfer.completed}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.hostname=localhost
eureka.instance.non-secure-port=8005
