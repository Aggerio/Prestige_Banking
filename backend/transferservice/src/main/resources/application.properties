spring.application.name=transferservice
spring.datasource.url=${ORACLE_JDBC_URL:jdbc:oracle:thin:@//localhost:1521/freepdb1}
spring.datasource.username=${ORACLE_USERNAME}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=${ORACLE_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${ORACLE_POOL_MIN_IDLE:2}
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.jakarta.persistence.lock.timeout=${ORACLE_LOCK_TIMEOUT_MS:5000}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OIDC_JWK_SET_URI}
app.security.audience=${OIDC_AUDIENCE}
app.security.customer-id-claim=customer_id
app.oracle.lock-timeout-seconds=${ORACLE_LOCK_TIMEOUT_SECONDS:5}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
